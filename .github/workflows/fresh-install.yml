name: Fresh-machine install

# Runs the real installer from the same one-liner the README gives people, as a
# brand new account, then checks the result from a clean login shell. This is the
# only thing in the repo that proves an install works, so it never runs on anyone's
# own machine: only on throwaway GitHub-hosted VMs and containers.

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1' # Weekly Monday, so a vendor change shows up without a push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:12', 'fedora:41']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install in a stock container as a new sudo user
        run: |
          docker run --rm -v "$PWD:/repo:ro" "${{ matrix.image }}" \
            bash /repo/tests/fresh-install/linux-container.sh full

  macos:
    name: macOS ${{ matrix.os }} (${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, shell: /bin/zsh }
          - { os: macos-15, shell: /bin/bash }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install as a new admin user with the runner's tools removed
        run: bash tests/fresh-install/macos-runner.sh "${{ matrix.shell }}" full

  # Homebrew builds much of the stack from source on macOS 14, so this takes over
  # an hour against 10 minutes on macOS 15. Too slow for every change, so weekly.
  macos-older:
    name: macOS macos-14 (/bin/zsh)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install as a new admin user with the runner's tools removed
        run: bash tests/fresh-install/macos-runner.sh /bin/zsh full
